# launcher-rs — example configuration
#
# Copy to ~/.config/launcher-rs/config.toml (or pass --config <file>).
# Every field is optional; the values below are the defaults, based on
# `original_source/dmenu.rasi` (the same visual scheme as the polybar status bar).
#
#   background #DEDEDE · text #333333 · selection #C5C5C5 (black text)
#   1px selection border #FF8C00 · square corners · 18px height

[bar]
# Monitor edge where the strip appears: "top" or "bottom".
edge = "top"
# Strip height in pixels (18 = thin bar; increase it for larger icons).
height = 18
# Outer horizontal margin (applied on both sides).
margin = 0
# Distance from the edge. Use, for example, 24 to sit just below the status bar.
offset = 0
# Width: pixels or a percentage ("80%"). Without this key it takes the whole
# width minus the margins (window { width: 100%; } in the rasi).
# width = "100%"
# Horizontal alignment when the width is narrower than the monitor.
align = "left"          # left | center | right

[monitor]
# Monitor where the strip appears.
# focused (active window) | primary | pointer | RandR index | connector name
target = "focused"

[appearance]
# font: "Sans 9" in the rasi. 9pt at 96dpi ≈ 12px (the size here is in pixels).
font = "Sans"
font_size = 12.0
font_weight = 400       # 100..900 (400 normal, 700 bold)
prompt = "Run: "
# Hint text shown in the input field while the query is empty.
# placeholder = "Type to search…"
# Icon theme; empty auto-detects via GTK and falls back to Adwaita/hicolor.
icon_theme = ""
# rofi uses ~1.2em for element-icon (1.2 x 12px ≈ 14px).
icon_size = 14
show_icons = true

# ---------------------------------------------------------------------------
# Style: colors, spacing, radii and borders.
# ---------------------------------------------------------------------------
[style]
# Ready-made theme (see `launcher-rs --themes`). Colors set explicitly in this
# section win over the theme. Empty = use the dmenu.rasi default (below).
theme = ""

# Default colors, listed for reference. Uncomment and change any of them to
# override just that detail.
# bg = "#dedede"           # strip background
# fg = "#333333"           # item text
# prompt_fg = "#333333"    # prompt text
# input_fg = "#333333"     # typed text
# cursor = "#333333"       # text cursor
# placeholder_fg = "#333333"
# selection_bg = "#c5c5c5" # selected item background
# selection_fg = "#000000" # selected item text
# scroll_fg = "#333333"    # < and > arrows
# The rasi does not highlight matched characters; uncomment to enable it.
# highlight_fg = "#ff8c00"

# Geometry.
padding = 2.0            # inner strip margin (window padding: 2px)
gap = 0.0                # spacing between icon/text, prompt/input, etc.
item_gap = 0.0           # spacing between cells (listview spacing: 0px)
item_padding = 10.0      # horizontal cell padding (element: 0px 10px)
# Search field width (entry: width 10em ≈ 120px).
search_width = 120
cursor_width = 1.5       # text cursor width
icon_radius = 0.0        # placeholder icon radius (0 = square)

# Selected item highlight (element selected):
# #C5C5C5 background, black text, 1px orange border, square corners.
selection_radius = 0.0
selection_border_width = 1.0
selection_border = "#ff8c00"

# Input field box. Without `input_bg` and with a 0 border it is not drawn
# (the rasi does not define a box for the entry).
# input_bg = "#00000033"
input_radius = 0.0
input_border_width = 0.0
input_border = "#c5c5c5"

# Inner border around the whole strip (the rasi uses no window border).
panel_border_width = 0.0
panel_border = "#c5c5c5"

[behavior]
# prefix | substring | fuzzy
match_mode = "fuzzy"
case_sensitive = false
# Sort by score. false keeps the reading order (like dmenu).
sort = true
# Terminal used by entries with Terminal=true (e.g. "alacritty -e").
# Empty uses $TERMINAL and then probes for a known terminal.
terminal = ""
# Print the selection instead of running it (useful for scripts/tests).
print_selection = false
# Shell used by `--dmenu --exec`.
shell = "/bin/sh"
# Generic icon when the .desktop file has no resolvable icon.
fallback_icon = "application-x-executable"
# Result limit (0 = no limit).
max_results = 0
