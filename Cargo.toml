[package]
name = "launcher-rs"
version = "0.1.3"
edition = "2021"
rust-version = "1.89"
description = "dmenu-style application launcher strip for X11 window managers, with icons"
license = "MIT"
repository = "https://github.com/EitaPreulaJhol/launcher-rs"
homepage = "https://github.com/EitaPreulaJhol/launcher-rs"
readme = "README.md"
keywords = ["dmenu", "launcher", "x11", "window-manager", "desktop"]
categories = ["command-line-utilities", "gui"]
default-run = "launcher-rs"

[lib]
name = "launcher_rs"
path = "src/lib.rs"

[[bin]]
name = "launcher-rs"
path = "src/main.rs"

[dependencies]
anyhow = "1"
dirs = "7"
serde = { version = "1", features = ["derive"] }
toml = "1"
x11rb = { version = "0.14", features = ["randr", "xinerama", "xkb"] }
xkeysym = "0.2"
tiny-skia = "0.12"
cosmic-text = "0.19"
resvg = { version = "0.50", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
