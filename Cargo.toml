[package]
name = "launcher-rs"
version = "0.2.0"
edition = "2021"
rust-version = "1.89"
description = "dmenu-style application launcher strip for X11 window managers, with icons"
license = "MIT"
repository = "https://github.com/EitaPreulaJhol/launcher-rs"
homepage = "https://github.com/EitaPreulaJhol/launcher-rs"
readme = "README.md"
keywords = ["dmenu", "launcher", "x11", "window-manager", "desktop"]
categories = ["command-line-utilities", "gui"]
default-run = "launcher-rs"

[lib]
name = "launcher_rs"
path = "src/lib.rs"

[[bin]]
name = "launcher-rs"
path = "src/main.rs"

[dependencies]
anyhow = "1"
dirs = "7"
serde = { version = "1", features = ["derive"] }
toml = "1"
x11rb = { version = "0.14", features = ["randr", "xinerama", "xkb"] }
xkeysym = "0.2"
tiny-skia = "0.12"
cosmic-text = "0.19"
resvg = { version = "0.50", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

[lints.clippy]
# Panics and leftovers in production code (tests are exempt, see clippy.toml).
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# Needless work.
redundant_clone = "warn"
implicit_clone = "warn"
cloned_instead_of_copied = "warn"
inefficient_to_string = "warn"
needless_collect = "warn"
or_fun_call = "warn"
needless_pass_by_value = "warn"
trivially_copy_pass_by_ref = "warn"
unnecessary_wraps = "warn"
# Readability.
manual_let_else = "warn"
semicolon_if_nothing_returned = "warn"
redundant_closure_for_method_calls = "warn"
uninlined_format_args = "warn"
doc_markdown = "warn"
allow_attributes_without_reason = "warn"

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "matching"
harness = false

[[bench]]
name = "startup"
harness = false

[[bench]]
name = "frame"
harness = false
