name: Fuzz

# Short fuzzing runs of every target in fuzz/. Kept out of the PR pipeline
# because it needs nightly and a few minutes per run.
on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: "120"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [desktop_entry, exec, icon_theme, config, matching]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
          key: ${{ matrix.target }}

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Fuzz
        env:
          SECONDS_PER_TARGET: ${{ inputs.seconds || '120' }}
        # The prebuilt cargo-fuzz binary is built for musl and defaults to
        # its own target, where the address sanitizer is unavailable.
        run: >-
          cargo fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }}
          -- -max_total_time="$SECONDS_PER_TARGET"

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
