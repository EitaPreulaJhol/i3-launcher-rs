name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc build linked against an old glibc with cargo-zigbuild, so
          # it runs on any distribution with glibc >= 2.28 (a plain build on
          # ubuntu-latest requires that runner's very recent glibc).
          - target: x86_64-unknown-linux-gnu
            glibc: "2.28"
          # Fully static musl binary. Every dependency is pure Rust, so musl
          # needs no C toolchain.
          - target: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install zig
        if: matrix.glibc
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Install cargo-zigbuild
        if: matrix.glibc
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Build release binary
        run: |
          if [ -n "${{ matrix.glibc }}" ]; then
            cargo zigbuild --locked --release --target "${{ matrix.target }}.${{ matrix.glibc }}"
          else
            cargo build --locked --release --target "${{ matrix.target }}"
          fi

      - name: Check the required glibc version
        if: matrix.glibc
        run: |
          binary=target/${{ matrix.target }}/release/launcher-rs
          limit=${{ matrix.glibc }}
          required=$(objdump -T "$binary" | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' | sed 's/^GLIBC_//' | sort -Vu | tail -1)
          echo "requires glibc $required (limit $limit)"
          if [ "$(printf '%s\n%s\n' "$required" "$limit" | sort -V | tail -1)" != "$limit" ]; then
            echo "::error::the binary requires glibc $required, newer than $limit"
            exit 1
          fi

      - name: Package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          archive="launcher-rs-${version}-${{ matrix.target }}.tar.gz"
          mkdir -p dist
          install -Dm755 target/${{ matrix.target }}/release/launcher-rs dist/launcher-rs
          cp README.md LICENSE config.example.toml dist/
          cp -r docs dist/
          tar -C dist -czf "$archive" .
          sha256sum "$archive" > "$archive.sha256"

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: launcher-rs-*.tar.gz*
          if-no-files-found: error

  # One job publishes every archive, so the matrix jobs do not race to
  # create the same release.
  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download archives
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            launcher-rs-*.tar.gz
            launcher-rs-*.tar.gz.sha256
          generate_release_notes: true
