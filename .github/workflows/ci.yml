name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Format, clippy and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps

  test:
    name: Test (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # stable plus the MSRV declared in Cargo.toml.
        toolchain: [stable, "1.89.0"]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust ${{ matrix.toolchain }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-${{ matrix.toolchain }}

      - name: Run tests
        run: cargo test --locked --all-targets

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Measure coverage
        run: cargo llvm-cov --locked --lcov --output-path lcov.info

      - name: Coverage summary
        run: |
          {
            echo '## Coverage'
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload lcov report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: error

  build:
    name: Release build (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: [lint, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc build linked against an old glibc with cargo-zigbuild, so
          # it runs on any distribution with glibc >= 2.28 (a plain build on
          # ubuntu-latest requires that runner's very recent glibc).
          - target: x86_64-unknown-linux-gnu
            glibc: "2.28"
          # Fully static musl binary. Every dependency is pure Rust, so musl
          # needs no C toolchain.
          - target: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install zig
        if: matrix.glibc
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Install cargo-zigbuild
        if: matrix.glibc
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Build release binary
        run: |
          if [ -n "${{ matrix.glibc }}" ]; then
            cargo zigbuild --locked --release --target "${{ matrix.target }}.${{ matrix.glibc }}"
          else
            cargo build --locked --release --target "${{ matrix.target }}"
          fi

      - name: Check the required glibc version
        if: matrix.glibc
        run: |
          binary=target/${{ matrix.target }}/release/launcher-rs
          limit=${{ matrix.glibc }}
          required=$(objdump -T "$binary" | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' | sed 's/^GLIBC_//' | sort -Vu | tail -1)
          echo "requires glibc $required (limit $limit)"
          if [ "$(printf '%s\n%s\n' "$required" "$limit" | sort -V | tail -1)" != "$limit" ]; then
            echo "::error::the binary requires glibc $required, newer than $limit"
            exit 1
          fi

      - name: Smoke test
        run: |
          binary=target/${{ matrix.target }}/release/launcher-rs
          file "$binary"
          "$binary" --version
          "$binary" --themes > /dev/null

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: launcher-rs-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/launcher-rs
          if-no-files-found: error
